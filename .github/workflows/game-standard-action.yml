name: game-standard-action

# The game-standard action's own tests. This repository is public, so GitHub's
# free standard hosted runners are allowed here (content-checks.yml runs the
# same way); a title repository runs the action on sylphx-linux-standard.
on:
  workflow_call:

concurrency:
  group: game-standard-action-${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Unit tests
        run: python3 -m unittest discover -s .github/actions/game-standard/test
      - name: The action runs, and fails closed in a repository with no manifest
        id: no-manifest
        continue-on-error: true
        uses: ./.github/actions/game-standard
      - name: Assert it failed
        if: steps.no-manifest.outcome != 'failure'
        run: |
          echo "::error::the game-standard action passed with no game-standard.toml; it must fail closed"
          exit 1
