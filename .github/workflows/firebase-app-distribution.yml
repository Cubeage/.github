# Reusable Firebase App Distribution Workflow
#
# Uploads an Android APK to Firebase App Distribution for tester access.
# Requires FIREBASE_CREDENTIALS (service account JSON) and FIREBASE_APP_ID secrets.
#
# Same-run caller: build the APK into build-output/ before these producer steps.
# The job output retains the producing attempt when only distribution is rerun.
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     build:
#       runs-on: sylphx-linux-standard
#       outputs:
#         distribution-entry: ${{ steps.distribution-entry.outputs.name }}
#       steps:
#         # Checkout and build the APK here.
#         - name: Name this build's handoff
#           id: distribution-entry
#           run: echo "name=android-build-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
#         - name: Store the APK directory
#           uses: SylphxAI/.github/.github/actions/run-store@4dcc910606d7624150d2004f2dd970eb570de30e
#           with:
#             mode: put
#             name: ${{ steps.distribution-entry.outputs.name }}
#             path: ./build-output
#             required: "true"
#     distribute:
#       needs: build
#       uses: Cubeage/.github/.github/workflows/firebase-app-distribution.yml@main
#       with:
#         app-id: ${{ vars.FIREBASE_APP_ID }}
#         artifact-name: ${{ needs.build.outputs.distribution-entry }}
#         release-notes: "SDK v3.1.68 update"
#         groups: "qa-testers"
#       secrets:
#         FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}

name: Firebase App Distribution

on:
  workflow_call:
    inputs:
      app-id:
        description: "Firebase Android App ID"
        required: true
        type: string
      artifact-name:
        description: "Same-run run-store entry containing the APK (seven-day availability)"
        required: true
        type: string
      release-notes:
        description: "Release notes for this distribution"
        required: false
        type: string
        default: "Automated build from CI"
      groups:
        description: "Tester groups (comma-separated)"
        required: false
        type: string
        default: "qa-testers"
    secrets:
      FIREBASE_CREDENTIALS:
        required: true

jobs:
  distribute:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ github.event.repository.private && 'sylphx-linux-standard' || 'ubuntu-latest' }}
    steps:
      - name: Download build artifact
        uses: SylphxAI/.github/.github/actions/run-store@4dcc910606d7624150d2004f2dd970eb570de30e # main
        with:
          mode: get
          name: ${{ inputs.artifact-name }}
          path: ./build-output
          required: "true"

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find ./build-output -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in artifact"
            exit 1
          fi
          echo "apk-path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_CREDENTIALS }}

      - name: Upload to Firebase App Distribution
        uses: google-github-actions/firebase-app-distribution@v2
        with:
          appId: ${{ inputs.app-id }}
          serviceAccount: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: ${{ inputs.groups }}
          file: ${{ steps.find-apk.outputs.apk-path }}
          releaseNotes: ${{ inputs.release-notes }}
