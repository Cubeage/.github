name: content-checks

# Company content rules on added lines only (SylphxAI/.github shared actions).
# - plain-language (owner standards/docs.md): advisory permanently; it warns and
#   never blocks, because a term list is never complete.
# - zh-hant (owner standards/experience.md): advisory until 2026-10-02. On that
#   date drop its continue-on-error and make the "zh-hant" check required.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  plain-language:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870
        continue-on-error: true

  zh-hant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/zh-hant@e48f73367c3f873a1a6930c844d053ac22b32262
        continue-on-error: true

  self-hosted-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: PyYAML for the guard tests
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            deps="${RUNNER_TEMP:-/tmp}/self-hosted-runners-python"
            mkdir -p "$deps"
            python3 -m pip install --quiet --disable-pip-version-check \
              --target "$deps" pyyaml==6.0.2
            echo "PYTHONPATH=$deps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          fi
      - name: Guard tests
        run: python3 .github/actions/self-hosted-runners/test/test_check_runners.py
      - name: Guard this repository (local action, same code other repos call)
        uses: ./.github/actions/self-hosted-runners
