name: self-hosted-runners
description: >
  Fail when any workflow in the repository can run on a runner that costs
  GitHub money: a private repository must use our own runners; a public one may
  also use GitHub's free standard hosted runners; larger and GPU runners are
  never allowed (zero GitHub spend, owner#750).
inputs:
  visibility:
    description: >
      "private" or "public". Defaults to the triggering repository's visibility;
      anything else is treated as private.
    required: false
    default: ${{ github.event.repository.private == false && 'public' || 'private' }}
runs:
  using: composite
  steps:
    # The runner's own python3 runs the guard: actions/setup-python downloads
    # and installs CPython on every run, which can exhaust a 5-minute job. Only
    # PyYAML is fetched, and only when the runner lacks it.
    - shell: bash
      env:
        VISIBILITY: ${{ inputs.visibility }}
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::the self-hosted-runners guard needs python3 on the runner"
          exit 1
        fi
        if ! python3 -c 'import yaml' >/dev/null 2>&1; then
          deps="${RUNNER_TEMP:-/tmp}/self-hosted-runners-python"
          mkdir -p "$deps"
          python3 -m pip install --quiet --disable-pip-version-check \
            --target "$deps" pyyaml==6.0.2
          export PYTHONPATH="$deps${PYTHONPATH:+:$PYTHONPATH}"
        fi
        exec python3 "$GITHUB_ACTION_PATH/check_runners.py" "$GITHUB_WORKSPACE" --visibility "$VISIBILITY"
